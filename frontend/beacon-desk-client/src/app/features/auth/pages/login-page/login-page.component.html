<div class="grid min-h-screen grid-cols-1 lg:grid-cols-2 bg-surface transition-colors duration-300">
  
  <section class="flex flex-col justify-center items-center p-6 lg:p-12 relative z-10">
    <div class="w-full max-w-[520px]">
      
      <div class="flex justify-between items-start mb-10"> 
        <div>
           <app-logo width="180px" class="block mb-6 text-text-main hover:text-primary transition-colors"></app-logo>
           <h1 class="text-4xl font-bold text-text-main mb-3">Bienvenido de Vuelta!</h1> 
           <p class="text-lg text-text-secondary">Qué bien que estás de regreso.</p> 
        </div>

        <button 
          (click)="themeService.toggleTheme()" 
          class="p-2 rounded-full hover:bg-surface-input text-text-main transition-colors duration-200"
          aria-label="Cambiar tema"
        >
          <span class="material-symbols-outlined text-2xl">
            {{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}
          </span>
        </button>
      </div>

      <div class="flex gap-8 border-b border-border mb-10">
        <button class="pb-3 border-b-2 border-primary text-primary font-bold text-base">Ingresar</button>
        <button class="pb-3 border-b-2 border-transparent text-text-secondary hover:text-text-main font-medium text-base transition-colors">Regístrate</button>
      </div>

      @if (errorMessage()) {
        <div class="flex items-center gap-3 p-4 mb-8 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl animate-fade-in">
          <span class="material-symbols-outlined text-error">error</span>
          <p class="text-sm text-error font-medium">{{ errorMessage() }}</p>
        </div>
      }

      <app-login-form 
        [isLoading]="isLoading()" 
        (onSubmit)="handleLogin($event)"
      ></app-login-form>

      <div class="mt-10 pt-8 border-t border-border">
        <p class="text-center text-text-secondary mb-6">O Continua con:</p>
        <button class="w-full h-14 flex justify-center items-center border border-border rounded-xl hover:bg-surface-input transition-colors bg-surface">
           <img src="assets/SVG/GoogleIcon.svg" alt="Google" class="w-6 h-6 mr-3">
           <span class="text-base font-semibold text-text-main">Google</span>
        </button>
      </div>

    </div>
  </section>

  <aside 
    class="hidden lg:flex relative w-full h-full bg-login-wallpaper bg-cover bg-center bg-no-repeat"
  >
    <div class="absolute inset-0 bg-black/10 dark:bg-black/60 transition-colors duration-500"></div>
  </aside>

</div>
